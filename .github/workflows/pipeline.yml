# .github/workflows/release.yml
name: Build, test, release

on:
  pull_request:
  push:
    # run only against tags
    tags:
      - "*"

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

    - name: Set up Go
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
      with:
        go-version: '1.21'

    - name: Install dependencies
      env:
        GOPATH: /home/runner/.go
      run: |
        mkdir /home/runner/.go
        make setup
        go env
        ls -lar $GOPATH

    - name: Run Lint
      env:
        GOPATH: /home/runner/.go
      run: /home/runner/.go/bin/golangci-lint run ./cli
  test:
    runs-on: ubuntu-latest
    env:
      RPC_URL: http://127.0.0.1:8545

    steps:
    - name: Checkout code
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

    - name: Set up Go
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
      with:
        go-version: '1.21'

    - name: Install dependencies
      run: |
       go mod download
       sudo apt-get install -y unzip
    
    - name: Download blockchain data
      run: |
        # Download Deneb state
        curl -o data/deneb_holesky_beacon_state_2227472.ssz.zip https://dviu8zszosyat.cloudfront.net/deneb_holesky_beacon_state_2227472.ssz.zip
        unzip -j data/deneb_holesky_beacon_state_2227472.ssz.zip -d data/
        
        # Download Electra state
        curl -o data/electra_mekong_beacon_state_654719.ssz.zip https://d1w8rcimizlk6a.cloudfront.net/electra_mekong_beacon_state_654719.ssz.zip
        unzip -j data/electra_mekong_beacon_state_654719.ssz.zip -d data/

    - name: Set up local EVM
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      with:
        version: v1.7.1

    - name: Load proof verifier
      shell: bash
      run: |
        anvil --host 127.0.0.1 > "$RUNNER_TEMP/anvil.log" 2>&1 &
        for attempt in {1..30}; do
          if cast block-number --rpc-url "$RPC_URL" --rpc-timeout 1 > /dev/null 2>&1; then break; fi
          sleep 1
        done
        bytecode=$(sed -n 's/^[[:space:]]*Bin: "\([^"]*\)",$/\1/p' bindings/BeaconChainProofsWrapper/binding.go)
        test -n "$bytecode"
        runtime_code=$(cast rpc --rpc-url "$RPC_URL" eth_call "{\"data\":\"$bytecode\"}" latest | jq -r .)
        cast rpc --rpc-url "$RPC_URL" anvil_setCode 0x874Be4b0CaC8D3F6286Eee6E6196553aabA8Cb85 "$runtime_code"

    - name: Run tests
      run: |
        go test -v ./...
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: Run GoReleaser (tagged release)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser (branch)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        if: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
